%YAML:1.0

#--------------------------------------------------------------------------------------------
# MI9T_640x360_0.6 monocular camera, ORB-SLAM3 settings format (File.version 1.0).
# Same values as the ORB-SLAM2 file of OA-SLAM.
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# Camera calibration and distortion parameters (OpenCV)
Camera1.fx: 349.8
Camera1.fy: 349.8
Camera1.cx: 320
Camera1.cy: 180

Camera1.k1: 0.0561645
Camera1.k2: 0
Camera1.p1: 0
Camera1.p2: 0
Camera1.k3: 0

Camera.width: 640
Camera.height: 360

# Camera frames per second
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.02
Viewer.KeyFrameLineWidth: 0.8
Viewer.GraphLineWidth: 0.6
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.04
Viewer.CameraLineWidth: 2.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
